name: Refresh current affairs

# Rebuilds current.json (oil and Bitcoin prices from FRED, MLB results from the
# MLB Stats API) and commits it back to main, so the site's Current affairs tab
# stays up to date while the site itself stays serverless. If a download fails,
# build_current.py raises and the job fails without committing, so the last good
# current.json stays in place.

on:
  schedule:
    - cron: '30 12 * * *'     # daily, 12:30 UTC: after US night games, as FRED posts new prices
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # commit current.json back
  pages: write                # ask Pages to redeploy

concurrency:
  group: current-affairs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build current.json
        run: python scripts/build_current.py current.json

      - name: Commit current.json if it changed
        id: commit
        run: |
          if git diff --quiet -- current.json; then
            echo "No change, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current.json
          git commit -m "Refresh current affairs data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status' || echo "Pages build request failed; the push may still trigger a deploy."
